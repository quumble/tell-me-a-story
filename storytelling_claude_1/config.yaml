# storytelling_claude_1 — one config file for the whole study.
#
# The research question (from the pilot data):
#   Given a vague cold prompt like "tell me a story please", how often does a
#   chat model collapse into the same "lighthouse keeper" attractor — an old
#   keeper, a great lamp, forty years, spiral stairs, a storm, a rescued boat,
#   a gentle moral, and a "want another?" sign-off?
#
# Everything you might want to change lives in this file.

study_id: storytelling_claude_1

# Stories per (provider x prompt) cell.
# 3 providers x 8 prompts x n_per_cell = total generations.
# n=100 -> 2400 total. Start small (e.g. n=2) for a smoke test.
n_per_cell: 100

# Max tokens of story to request.
#
# COST LEVER: the attractor signal (role + setting + opening situation) lives in
# the first ~1-2 sentences, so a tight cap keeps the signal while cutting cost
# ~5x. Measured on the smoke-test data, ~150 tokens retains ~87% of the motif
# signal — past that, returns flatten fast. Lower this to save money; raise it
# only if you also want readable full stories for qualitative review.
#   100 = plenty for merely detecting an attractor
#   150 = enough to distinguish WHICH attractor (recommended for this study)
#   1200 = full readable stories, for qualitative review
max_output_tokens: 150

# Seconds to wait between API calls (gentle on rate limits).
sleep_between_calls: 0.25

# Where everything is written. One flat, human-readable CSV. That's it.
output_csv: data/stories.csv

# ----------------------------------------------------------------------------
# Providers. Set enabled: false to skip one. Set the model string for each.
#
# IMPORTANT — verify these model IDs against each provider's current docs
# before a real run. As of May 2026 `claude-sonnet-4-6` is a real, current
# Anthropic model. The OpenAI and Gemini strings below are placeholders that
# match the original study's intent (an average free-tier proxy) — confirm
# them for your own API keys, since they are the most likely thing to break.
#
# PER-PROVIDER TOKEN CAP: a provider may set its own `max_output_tokens` to
# override the global one above. (Currently none do — all three use the global
# 150. This override remains available in case a provider needs different
# headroom later.) Note: Gemini required a separate fix — thinking is disabled
# in run.py so reasoning tokens don't consume the output budget; with that in
# place Gemini uses the same 150 cap as the others.
# ----------------------------------------------------------------------------
providers:
  openai:
    enabled: true
    model: gpt-5.5            # verify against current OpenAI model list
    api_key_env: OPENAI_API_KEY
    # inherits global max_output_tokens (150)

  anthropic:
    enabled: true
    model: claude-sonnet-4-6  # real, current Anthropic model (free-user proxy)
    api_key_env: ANTHROPIC_API_KEY
    # inherits global max_output_tokens (150)

  gemini:
    enabled: false            # OFF: free tier is 20 requests/day, far below the
                              # 800 this study needs. Re-enable once billing is
                              # set up, or run it later at a smaller n.
    model: gemini-3.5-flash   # verify against current Gemini model list
    api_key_env: GEMINI_API_KEY
    # inherits global max_output_tokens (150). NOTE: thinking is disabled for
    # Gemini in run.py (thinking_budget=0); without that, reasoning tokens eat
    # the budget and you get fragments. With thinking off, Gemini behaves like
    # the others and the global 150 cap is correct.

# ----------------------------------------------------------------------------
# Prompt cells. The text IS the experimental condition — keep it verbatim.
# ----------------------------------------------------------------------------
prompts:
  - id: P01_baseline_please
    text: "tell me a story please"
  - id: P02_baseline_plain
    text: "tell me a story"
  - id: P03_write_variant
    text: "write me a story"
  - id: P04_short_variant
    text: "tell me a short story please"
  - id: P05_strange_variant
    text: "tell me a strange story please"
  - id: P06_funny_variant
    text: "tell me a funny story please"
  - id: P07_random_setting
    text: "tell me a story please. First choose a random setting and genre."
  - id: P08_suppression
    text: "tell me a story please, but not about lighthouses, lamps, the sea, ships, storms, fog, islands, cliffs, or old caretakers."
