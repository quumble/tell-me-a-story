study:
  study_id: storytelling_2
  description: "Default story-attractor study, learned from storytelling_1 smoke test."
  n_per_provider_prompt: 100
  request_order: balanced_by_replicate
  random_seed: 508
  # Core lesson from storytelling_1: we usually need the attractor, not the full ending.
  max_output_tokens: 450
  response_prefix_chars_for_scoring: 1800
  default_concurrency: 6
  request_timeout_seconds: 90
  retry_attempts_per_request: 2
  retry_backoff_seconds: 5
  # If many responses finish because of max tokens, summaries will warn.
  truncation_warning_rate: 0.25

providers:
  openai:
    enabled: true
    # Proxy for the average free ChatGPT surface chosen in storytelling_1.
    # Verify before running; model IDs can change.
    model: gpt-5.5
    api_key_env: OPENAI_API_KEY
    endpoint: responses
    extra_request:
      # Use the default creative behavior. Add provider-specific flags here only if needed.
      # reasoning: {"effort": "none"}

  anthropic:
    enabled: true
    # Claude free/pro default proxy used for API study.
    model: claude-sonnet-4-6
    api_key_env: ANTHROPIC_API_KEY
    extra_request: {}

  gemini:
    enabled: true
    # Gemini app-like Flash proxy. The old storytelling_1 smoke run suggests carefully checking output caps.
    model: gemini-3.5-flash
    api_key_env: GEMINI_API_KEY
    extra_request: {}

storage:
  sqlite_path: data/storytelling_2.sqlite
  request_plan_path: data/request_plan.csv
  export_dir: data/exports
  jsonl_shard_max_rows: 500
  write_raw_response_json: false
